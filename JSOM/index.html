<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON整形ツール</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* --- ベース設定 --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      line-height: 1.6;
      padding: 20px;
    }

    /* --- ヘッダー --- */
    .app-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .app-header h1 {
      font-size: 1.8rem;
      color: #1a1a1a;
    }

    /* --- メインレイアウト --- */
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* --- ツールバー --- */
    .toolbar {
      background-color: #ffffff;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .select-box {
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #fff;
      font-size: 0.9rem;
    }

    .button-group {
      display: flex;
      gap: 8px;
    }

    /* --- ボタン --- */
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary {
      background-color: #0066cc;
      color: #fff;
    }

    .btn-secondary {
      background-color: #e0e0e0;
      color: #333;
    }

    /* アイコンボタン（コピー用） */
    .btn-icon {
      padding: 6px 10px;
      font-size: 0.9rem;
      background-color: #ffffff;
      border: 1px solid #ccc;
      border-radius: 4px;
      color: #555;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover {
      background-color: #f0f0f0;
      color: #0066cc;
      border-color: #0066cc;
    }

    /* --- ワークスペース（2カラム構成） --- */
    .workspace {
      display: flex;
      gap: 16px;
    }

    @media (max-width: 768px) {
      .workspace {
        flex-direction: column;
      }
    }

    .editor-panel {
      flex: 1;
      background-color: #ffffff;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .panel-header {
      padding: 10px 16px;
      background-color: #f8f9fa;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header h2 {
      font-size: 1rem;
      color: #444;
    }

    /* --- テキストエリア --- */
    .code-textarea {
      width: 100%;
      height: 400px;
      padding: 12px;
      border: none;
      resize: vertical;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.9rem;
      line-height: 1.4;
      outline: none;
      background-color: #fafafa;
    }

    .code-textarea:focus {
      background-color: #ffffff;
    }

    /* --- フッター --- */
    .panel-footer {
      padding: 6px 16px;
      background-color: #f8f9fa;
      border-top: 1px solid #e0e0e0;
      font-size: 0.8rem;
      color: #777;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>JSONデータの整形・検証・相互変換ツール</h1>
  </header>

  <main class="main-container">

    <section class="toolbar">
      <div class="tool-group">
        <label for="indent-select">インデント:</label>
        <select id="indent-select" class="select-box">
          <option value="2">2 スペース</option>
          <option value="4">4 スペース</option>
          <option value="tab">タブ</option>
        </select>
      </div>

      <div class="tool-group">
        <label for="convert-select">変換モード:</label>
        <select id="convert-select" class="select-box">
          <option value="json">JSON (整形)</option>
          <option value="minified">JSON (軽量化/1行)</option>
          <option value="yaml">YAML に変換</option>
          <option value="csv">CSV に変換</option>
        </select>
      </div>

      <div class="button-group">
        <button class="btn btn-primary">実行 / 整形</button>
        <button class="btn btn-secondary">クリア</button>
      </div>
    </section>

    <section class="workspace">
      
      <div class="editor-panel">
        <div class="panel-header">
          <h2>入力 (Raw JSON)</h2>
        </div>
        <textarea 
          class="code-textarea" 
          placeholder='ここにJSONを入力してください...&#10;例: {"name": "太郎", "age": 25}'
          spellcheck="false"
        ></textarea>
        <div class="panel-footer">
          <span>文字数: 0</span>
        </div>
      </div>

      <div class="editor-panel">
        <div class="panel-header">
          <h2>出力 (Result)</h2>
          <button class="btn-icon" title="コピー">
            <i class="fa-regular fa-copy"></i>
          </button>
        </div>
        <textarea 
          class="code-textarea" 
          readonly 
          placeholder="変換結果がここに表示されます..."
          spellcheck="false"
        ></textarea>
        <div class="panel-footer">
          <span>ステータス: 準備完了</span>
        </div>
      </div>

    </section>

  </main>

</body>
</html>
